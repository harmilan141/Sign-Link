# experiment.yaml
# Central experiment configuration file for ISL-to-English translation model training.
# --- ACTIVE CONFIG: A7 Production Run 2 (GPU-trained 2026-07-22, dgxhnode2) ---
# Val BLEU-4: 22.66 | ROUGE-L: 28.04 | WER: 84.51%

# Data Paths
npz_dir: "/workspace/SignLink/preprocessed"
save_dir: "/workspace/SignLink/models/A7_production_v2"
log_dir: "/workspace/SignLink/logs"

# Training Settings
epochs: 35
batch_size: 16
lr: 0.0001
weight_decay: 0.0001
num_workers: 4
label_smoothing: 0.1

# Cross-Validation settings
use_cross_val: false
k_folds: 5
val_split: 0.1

# Tokenizer Priming settings (A7: hi_IN source, en_XX target)
src_lang: "hi_IN"
tgt_lang: "en_XX"

# Model Hyperparameters
input_dim: 1665  # 1662 coordinates + 3 visibility mask bits
d_model: 512
nhead: 8
num_encoder_layers: 6
use_modality_encoders: true  # A3+: Separate Pose/Hand/Face linear encoders

# Decoder Adaptation Options
# Choices: "frozen", "cross_attn_unfrozen", "lora_cross_attn"
# A7: full cross-attention unfrozen (best quality, 57.5M trainable params)
decoder_adapt_mode: "cross_attn_unfrozen"
lora_r: 8
lora_alpha: 16.0

# Auxiliary Loss Parameters (A5+: CTC alignment head)
use_auxiliary_ctc: true
lambda_ctc: 0.3

# Data Augmentation Probability / Scale Settings
augment_config:
  # Spatial Coordinates Augmentations
  jitter_prob: 0.5
  jitter_std: 0.005
  scale_prob: 0.5
  scale_min: 0.95
  scale_max: 1.05
  rotate_prob: 0.5
  rotate_max_angle_deg: 10.0
  mirror_prob: 0.0  # Disabled by default since some signs are hand-specific
  
  # Temporal / Resampling Augmentations
  speed_warp_prob: 0.5
  speed_warp_min: 0.8
  speed_warp_max: 1.2
  frame_dropout_prob: 0.5
  frame_dropout_rate: 0.05
